<!DOCTYPE html>

<style>

html,body{height:100%;margin:0}

.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:16px;text-align:center}
.stat.al{border-color:var(--warn);color:var(--warn)}
#g{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:240px;height:70px}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
button{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:8px;padding:9px 14px;background:var(--panel);color:var(--ink);cursor:pointer}
button.p{background:var(--go);color:#04121c;border-color:var(--go)}
button.d{border-color:var(--warn);color:var(--warn)}
button[aria-pressed="true"]{background:var(--go);color:#04121c}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.mb{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 14px;font:11px Courier New,monospace;letter-spacing:.12em;color:var(--mut);background:linear-gradient(#04060bd0,transparent);direction:ltr;pointer-events:none}
.mb b{color:var(--go)}
.hud{top:calc(36px + env(safe-area-inset-top,0px))}
#log{position:fixed;left:10px;top:calc(40px + env(safe-area-inset-top,0px));width:330px;font:11px/1.5 Courier New,monospace;direction:ltr;background:#0d1422cc;border:1px solid var(--line);border-radius:8px;padding:6px 10px;pointer-events:none}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log .w{color:#ffb347}#log .e{color:var(--warn)}#log .o{color:#3ddc84}
.vg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#000b 100%)}
#tel{position:fixed;right:10px;top:calc(40px + env(safe-area-inset-top,0px));width:236px;max-height:calc(100% - 150px);overflow:auto;direction:ltr;font:11px/1.45 Courier New,monospace;background:#0d1422d9;border:1px solid var(--line);border-radius:8px;padding:4px 10px 8px}
#tel h4{margin:8px 0 2px;font-size:10px;letter-spacing:.14em;color:var(--go)}
#tel div{display:flex;justify-content:space-between;gap:8px;color:var(--mut)}
#tel b{color:var(--ink);font-weight:400}#tel i{font-style:normal}
#tel.off{display:none}
@media(max-width:760px){#log{display:none}#tel{top:auto;bottom:130px;max-height:34%}}
</style>
</head>

    if(s==='idle')log(pst==='alert'?'ALARM CANCELLED  FALSE POSITIVE':'SYSTEM RESET','o');
    pst=s}
  const m=Math.floor((now-t0)/1000);met.textContent='MET '+String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  gtx.textContent=(moon?'LUNAR ':'MARTIAN ')+g.toFixed(2)+'g';
  if(s==='idle'){legs.forEach((l,i)=>l.rotation.x=Math.sin(wt*3.2+i*Math.PI)*.4);pv.position.y=hopT>=0&&hopT<hopTot?2*(hopT/hopTot)*(1-hopT/hopTot):Math.abs(Math.sin(wt*1.6))*.07;if(!drag&&!foc)yaw+=dt*.12}
  else legs.forEach(l=>l.rotation.x*=.9);
  if(dl>0){dl-=dt*.28;dm.opacity=Math.min(1,dl*1.4)*.7;for(let i=0;i<DN;i++){dv[i*3+1]-=g*9.8*dt;for(let k=0;k<3;k++)dp[i*3+k]+=dv[i*3+k]*dt;if(dp[i*3+1]<0){dp[i*3+1]=0;dv[i*3]=dv[i*3+1]=dv[i*3+2]=0}}dgm.attributes.position.needsUpdate=true}
  const hot=ledR.material.color.r>.5;glw.material.opacity=hot?1:0;glw2.material.opacity=hot?.3:0;
  if(s==='sos'){sosT+=dt;beam.material.opacity=.6;pls.forEach((p,i)=>{p.position.lerpVectors(A0,B0,(sosT*.7+i/3)%1);p.material.opacity=1});
    if(sosT>1.4&&!rxd){rxd=true;log('HABITAT RX: SOS ACK  CREW ALERTED','o')}
    bea.material.color.set(rxd&&Math.floor(sosT*4)%2?0xff3b2f:0x39e07a)}
  else{beam.material.opacity=0;pls.forEach(p=>p.material.opacity=0);bea.material.color.set(0x39e07a)}
  shake*=.9;requestAnimationFrame(watch)}
requestAnimationFrame(watch);
// ===== full telemetry =====
let hopT=-1,hopTot=1.6;
function magf(){const n=1+(Math.random()-.5)*.06;if(S.st==='falling')return .12+Math.random()*.06;if(S.imp<.4)return 1+3*Math.exp(-S.imp*9)*(.8+Math.random()*.4);
  if(hopT>=0){if(hopT<hopTot)return .1+Math.random()*.05;const q=hopT-hopTot;if(q<.5)return 1+.8*Math.exp(-q*10)*(.8+Math.random()*.4)}return n}
document.getElementById('hop').onclick=()=>{if(S.st==='idle'&&hopT<0){hopTot=2*Math.sqrt(1/(gv()*9.81));hopT=0;log('NORMAL HOP  0.5 m (should be ignored)','w')}};
const SECS=[['MPU6050 (LIVE)',[['ax','Accel X','g'],['ay','Accel Y','g'],['az','Accel Z','g'],['am','|a|','g'],['amm','|a|','m/s2'],['gx','Gyro X','deg/s'],['gy','Gyro Y','deg/s'],['gz','Gyro Z','deg/s'],['tilt','Tilt','deg']]],
 ['GRAVITY-SCALED THRESHOLDS',[['gl','Local g','m/s2'],['tff','Free-fall <','m/s2'],['timp','Impact >','m/s2']]],
 ['LAST EVENT',[['dec','Decision',''],['ffd','Free-fall','ms'],['pk','Impact peak','g'],['drop','Belt drop','cm'],['vi','Impact speed','m/s'],['en','Impact energy','J']]],
 ['TIMING',[['fd','Fall duration','s'],['rea','Cancel reaction','s'],['sostr','SOS trigger',''],['rx','Link ACK (sim)','s']]],
 ['RF LINK TO BASE',[['dist','Distance','m'],['rssi','RSSI (model)','dBm'],['flt','RF flight','ns'],['pkts','Packets sent',''],['px','Rel. position','m']]],
 ['POWER (18650, 3000 mAh)',[['cur','Current','mA'],['run','Runtime at mode','h'],['uah','Charge used','uAh'],['bat','Battery','%']]],
 ['SESSION',[['falls','Falls confirmed',''],['hops','Hops ignored',''],['cancels','Alarms cancelled',''],['sosn','SOS sent','']]]];
const pan=document.getElementById('tel'),els={};
SECS.forEach(([h,rows])=>{pan.insertAdjacentHTML('beforeend','<h4>'+h+'</h4>');rows.forEach(([k,l,u])=>pan.insertAdjacentHTML('beforeend','<div><span>'+l+'</span><b><i id=t_'+k+'>-</i> '+u+'</b></div>'))});
const put=(k,v)=>{(els[k]||(els[k]=document.getElementById('t_'+k))).textContent=v};
const tb=document.getElementById('telb');if(innerWidth<760){pan.classList.add('off');tb.setAttribute('aria-pressed',false)}
tb.onclick=()=>{const o=pan.classList.toggle('off');tb.setAttribute('aria-pressed',!o)};
const Q={falls:0,hops:0,cancels:0,sos:0,pk:0,ffd:0,drop:0,vi:0,en:0,fd:0,react:0,tF:0,tI:0,tS:0,pkts:0,uAh:0,dec:'-',mode:'-',tx:0,rx:0,rxs:1,nx:0};
let tpst='idle',th=0,tu=0,tl=performance.now(),ff=false,ffT=0,win=0,pk=0,y0=1,ymin=9,pa=0,pw=0;const wv=new T.Vector3(),DIS=Math.hypot(9,7),f=(v,d=2)=>(v<0?'':'+')+v.toFixed(d);
function tele(now){
  const dt=Math.min((now-tl)/1000,.05);tl=now;th+=dt;
  const s=S.st,idle=s==='idle',gm=gv()*9.81,m=magf(),a=pv.rotation.x;
  pw=pw*.8+((a-pa)/Math.max(dt,.001)*57.3)*.2;pa=a;
  const sw=idle?Math.sin(th*3.2):0,GX=pw+(Math.random()-.5)*3+sw*8,GY=(Math.random()-.5)*3+sw*4,GZ=(Math.random()-.5)*3+(idle?Math.sin(th*1.6)*3:0);
  mod.getWorldPosition(wv);if(idle&&hopT<0)y0=wv.y;if(s==='falling')ymin=Math.min(ymin,wv.y);
  if(hopT>=0){hopT+=dt;if(hopT>hopTot+.6)hopT=-1}
  if(s!==tpst){
    if(s==='falling')ymin=9,Q.tF=now;
    if(s==='alert'){Q.tI=now;Q.falls++;Q.fd=(now-Q.tF)/1000;Q.drop=Math.max(0,y0-ymin);Q.vi=Math.sqrt(2*gm*Q.drop);Q.en=.5*120*Q.vi*Q.vi}
    if(s==='sos'){Q.tS=now;Q.sos++;Q.pkts=1;Q.nx=now+1000;Q.rxs=0;Q.rx=0;Q.mode=tpst==='alert'?'AUTO '+((now-Q.tI)/1000).toFixed(1)+' s':'MANUAL'}
    if(s==='idle'&&tpst==='alert'){Q.cancels++;Q.react=(now-Q.tI)/1000}
    tpst=s}
  if(s==='sos'){if(now>Q.nx&&!rxd){Q.pkts++;Q.nx=now+1000}if(rxd&&!Q.rxs){Q.rxs=1;Q.rx=(now-Q.tS)/1000}}
  // dual-threshold detector (free-fall then impact)
  if(m<.4){ffT+=dt;if(ffT>=.06)ff=true}
  else if(ff){win+=dt;pk=Math.max(pk,m);if(win>=.25){
    if(pk>2.5)Q.dec='FALL CONFIRMED';else{Q.dec='HOP IGNORED';Q.hops++;log('HOP IGNORED  peak '+pk.toFixed(1)+'g < 2.5g','o')}
    Q.pk=pk;Q.ffd=ffT*1000;ff=false;ffT=0;win=0;pk=0}}else ffT=0;
  const I=idle?1.2:s==='falling'?45:s==='alert'?85:160;Q.uAh+=I*dt/3.6;
  if(th-tu>.1){tu=th;
    put('ax',f((Math.random()-.5)*.04));put('ay',f(Math.cos(a)*m));put('az',f(-Math.sin(a)*m));put('am',m.toFixed(2));put('amm',(m*gm).toFixed(1));
    put('gx',f(GX,0));put('gy',f(GY,0));put('gz',f(GZ,0));put('tilt',(Math.abs(a)*57.3).toFixed(0));
    put('gl',gm.toFixed(2));put('tff',(.4*gm).toFixed(2));put('timp',(2.5*gm).toFixed(1));
    put('dec',Q.dec);put('ffd',Q.ffd.toFixed(0));put('pk',Q.pk.toFixed(1));put('drop',(Q.drop*100).toFixed(0));put('vi',Q.vi.toFixed(2));put('en',Q.en.toFixed(0));
    put('fd',Q.fd.toFixed(2));put('rea',Q.react.toFixed(1));put('sostr',Q.mode);put('rx',Q.rx.toFixed(1));
    put('dist',DIS.toFixed(1));put('rssi',(10-(40+20*Math.log10(DIS))).toFixed(1));put('flt',(DIS/.3).toFixed(0));put('pkts',Q.pkts);put('px','9.0, 7.0');
    put('cur',I.toFixed(1));put('run',(2460/I).toFixed(0));put('uah',Q.uAh.toFixed(1));put('bat',(82-Q.uAh/30000).toFixed(3));
    put('falls',Q.falls);put('hops',Q.hops);put('cancels',Q.cancels);put('sosn',Q.sos)}
  requestAnimationFrame(tele)}
requestAnimationFrame(tele);
// SOS rings
const rings=[0,1,2].map(()=>{const m=new T.Mesh(new T.RingGeometry(.95,1,64),new T.MeshBasicMaterial({color:0x5cc8ff,transparent:true,opacity:0,side:T.DoubleSide}));m.rotation.x=-Math.PI/2;m.position.y=.03;sc.add(m);return m});

// OLED
let ok='';
function oled(a,b,col,inv){const k=a+b+col+inv;if(k===ok)return;ok=k;
  ox.fillStyle=inv?col:'#02060a';ox.fillRect(0,0,256,128);ox.fillStyle=inv?'#02060a':col;
  ox.font='bold 34px Courier New,monospace';ox.fillText(a,14,48);ox.font='15px Courier New,monospace';ox.fillText(b,14,80);
  if(a==='BELTAID'){ox.fillStyle='#3ddc84';ox.fillRect(14,98,120,10);ox.strokeStyle='#3ddc84';ox.strokeRect(14,98,140,10);ox.fillText('82%',164,108)}
  otx.needsUpdate=true}

// state
const S={st:'idle',t:0,imp:9},st=document.getElementById('st'),gc=document.getElementById('g'),gx=gc.getContext('2d');
let moon=true,sl='';
const gv=()=>moon?.16:.38;
function stat(t,al){if(t!==sl){sl=t;st.textContent=t}st.classList.toggle('al',!!al)}
let actx;function beep(f=880,d=.12){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
function reset(){S.st='idle';S.t=0;S.imp=9;pv.rotation.x=0;pv.position.y=0;ledR.material.color.set(0x40100c);alL.intensity=0;btnM.emissive.set(0x4a0a06);rings.forEach(r=>r.material.opacity=0)}
const toSOS=()=>{S.st='sos';S.t=0};
document.getElementById('fall').onclick=()=>{if(S.st==='idle'){S.st='falling';S.t=0;beep(600)}};
document.getElementById('cancel').onclick=()=>{if(S.st==='alert')reset()};
document.getElementById('sos').onclick=()=>{if(S.st==='idle'||S.st==='alert')toSOS()};
document.getElementById('reset').onclick=reset;
const gb=document.getElementById('grav');
gb.onclick=()=>{if(S.st!=='idle')reset();moon=!moon;gb.textContent=moon?'الجاذبية: القمر 0.16g':'الجاذبية: المريخ 0.38g'};
const fb=document.getElementById('foc');let foc=false,dd=7;
fb.onclick=()=>{foc=!foc;fb.setAttribute('aria-pressed',foc);dd=foc?2.3:7};

// sensor graph
const buf=new Array(160).fill(1);let gt=0;
const sig=()=>magf();
const gy=v=>62-Math.min(v,4.2)/4.2*52;
function graph(){gx.clearRect(0,0,240,70);gx.font='10px Courier New,monospace';gx.fillStyle='#8fa0b8';gx.fillText('MPU6050 |a| (x local g)',6,10);
  gx.setLineDash([4,4]);gx.lineWidth=1;[[.4,'#ffb347'],[2.5,'#ff5a4d']].forEach(([v,c])=>{gx.strokeStyle=c;gx.beginPath();gx.moveTo(0,gy(v));gx.lineTo(240,gy(v));gx.stroke()});gx.setLineDash([]);
  gx.strokeStyle='#5cc8ff';gx.lineWidth=1.5;gx.beginPath();buf.forEach((v,i)=>{const x=i*240/159;i?gx.lineTo(x,gy(v)):gx.moveTo(x,gy(v))});gx.stroke()}

// camera
let yaw=.9,pitch=.2,dist=7,drag=false,lx=0,ly=0;const look=new T.Vector3(0,.9,0),tmp=new T.Vector3();
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*.008;pitch=Math.min(1.35,Math.max(.02,pitch+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY});
const up=()=>drag=false;cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();dd=Math.min(16,Math.max(1.5,dd+e.deltaY*.008))},{passive:false});
function resize(){const w=innerWidth,h=innerHeight;rd.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,.05)*TS;last=now;S.t+=dt;S.imp+=dt;
  const gn=moon?'MOON':'MARS',on=Math.floor(S.t*4)%2===0;
  if(S.st==='idle'){oled('BELTAID',gn+' '+gv()+'g  GPS OK','#5cc8ff',0);stat('الحزام جاهز — رائد الفضاء يسير على سطح '+(moon?'القمر':'المريخ'),0)}
  else if(S.st==='falling'){
    const dur=2.4*Math.sqrt(.16/gv()),k=Math.min(S.t/dur,1),e=k*k;
    pv.rotation.x=-e*Math.PI/2;pv.position.y=.3*e;
    oled('FREE-FALL','Verifying impact...','#ffb347',0);stat('رصد سقوط حر عند جاذبية '+gv()+'g — جارٍ التحقق من الارتطام',1);
    if(k>=1){S.st='alert';S.t=0;S.imp=0;beep(300,.3)}
  }else if(S.st==='alert'){
    const left=5-S.t;ledR.material.color.set(on?0xff3b2f:0x40100c);alL.intensity=on?2.2:0;btnM.emissive.set(on?0xff2a1a:0x4a0a06);
    oled('FALL!','CANCEL/SOS '+Math.max(0,Math.ceil(left))+'s','#ff3b2f',on?1:0);
    stat('سقوط مؤكد — ألغِ الإنذار خلال '+Math.max(0,Math.ceil(left))+' ث أو سيُرسل SOS',1);
    if(on&&Math.floor((S.t-dt)*4)%2!==0)beep(880);
    if(left<=0)toSOS();
  }else if(S.st==='sos'){
    const o=Math.floor(S.t*3)%2===0;ledR.material.color.set(o?0xff3b2f:0x40100c);alL.intensity=o?2.2:.4;
    oled('SOS SENT','LOCAL BROADCAST','#ffb347',o?1:0);stat('تم إرسال SOS مع الموقع المحلي إلى الطاقم ومحطات القاعدة',1);
    rings.forEach((r,i)=>{const p=(S.t*.5+i/3)%1;r.scale.setScalar(1+p*9);r.material.opacity=.7*(1-p)})}
  gt+=dt;if(gt>.035){gt=0;buf.push(sig());buf.shift();graph()}
  if(foc)mod.getWorldPosition(tmp);else tmp.set(0,.9,0);
  look.lerp(tmp,.1);dist+=(dd-dist)*.06;
  cam.position.set(look.x+Math.sin(yaw)*Math.cos(pitch)*dist,look.y+Math.sin(pitch)*dist,look.z+Math.cos(yaw)*Math.cos(pitch)*dist);
  cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake;cam.lookAt(look);rd.render(sc,cam);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
